services:
  - type: web
    name: online-sports-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn backend.app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: online-sports-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: online-sports-frontend
    env: python
    buildCommand: pip install -r frontend/requirements.txt
    startCommand: python frontend/main.py
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: online-sports-backend
          property: host

databases:
  - name: online-sports-db
    plan: free
