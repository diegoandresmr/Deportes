{% extends "base.html" %}

{% block title %}Editar Noticia - Online Sports{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4 class="card-title mb-0">📝 Editar Noticia</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="titulo" class="form-label">Título:</label>
                        <input type="text" class="form-control" id="titulo" name="titulo" value="{{ noticia.titulo }}"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="contenido" class="form-label">Contenido:</label>
                        <textarea class="form-control" id="contenido" name="contenido" rows="6"
                            required>{{ noticia.contenido }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="deporte" class="form-label">Deporte:</label>
                        <select class="form-select" id="deporte" name="deporte" required>
                            <option value="futbol" {% if noticia.deporte=='futbol' %}selected{% endif %}>Fútbol</option>
                            <option value="baloncesto" {% if noticia.deporte=='baloncesto' %}selected{% endif %}>
                                Baloncesto</option>
                            <option value="tenis" {% if noticia.deporte=='tenis' %}selected{% endif %}>Tenis</option>
                            <option value="formula1" {% if noticia.deporte=='formula1' %}selected{% endif %}>Fórmula 1
                            </option>
                            <option value="beisbol" {% if noticia.deporte=='beisbol' %}selected{% endif %}>Béisbol
                            </option>
                            <option value="otros" {% if noticia.deporte=='otros' %}selected{% endif %}>Otros</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="autor" class="form-label">Autor:</label>
                        <input type="text" class="form-control" id="autor" name="autor" value="{{ noticia.autor }}"
                            required>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="destacada" name="destacada" {% if
                            noticia.destacada %}checked{% endif %}>
                        <label class="form-check-label" for="destacada">Noticia destacada</label>
                    </div>

                    <button type="submit" class="btn btn-primary">Actualizar Noticia</button>
                    <a href="{{ url_for('noticia_detalle', noticia_id=noticia.id) }}"
                        class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
